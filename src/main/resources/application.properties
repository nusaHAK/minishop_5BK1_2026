spring.application.name=minishop

spring.datasource.url=jdbc:mysql://localhost:3306/minishop
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# Statische Dateien (style.css, Bilder) im Betrieb nicht cachen, damit
# Aenderungen ohne Hard-Reload sichtbar werden.
spring.web.resources.cache.period=0

# Grenzen fuer den Upload von Produktbildern
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
#Session-ID nur per Cookie verfolgen. Sonst hängt Spring beim ersten Aufruf
#des Warenkorbs ";jsessionid=..." an alle Links, was zu 404 fuehrt.
server.servlet.session.tracking-modes=cookie

