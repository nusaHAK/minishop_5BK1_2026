<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${productView.pid} != null ? 'Produkt bearbeiten' : 'Produkt anlegen'">Produkt anlegen</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="navbar-inner container">
            <a class="brand" th:href="@{/admin/products}">
                <span class="brand-mark">MS</span>
                MiniShop
            </a>
            <nav class="nav-links" aria-label="Hauptnavigation">
                <a class="nav-link is-active" th:href="@{/admin/products}">Produkte</a>
                <a class="nav-link" th:href="@{/admin/products/new}">Produkt hinzufügen</a>
            </nav>
        </div>
    </header>

    <main class="container page">

        <!-- Seitenkopf -->
        <div class="page-header">
            <div>
                <p class="eyebrow">Administration</p>
                <h1 th:text="${productView.pid} != null ? 'Produkt bearbeiten' : 'Neues Produkt anlegen'">Produkt anlegen</h1>
                <p class="page-subtitle"
                   th:text="${productView.pid} != null ? 'Ändern Sie die Daten des bestehenden Produkts.' : 'Füllen Sie die Felder aus, um ein neues Produkt anzulegen.'">
                    Füllen Sie die Felder aus, um ein Produkt anzulegen.
                </p>
            </div>
        </div>

        <!-- Formular -->
        <div class="card form-card">
            <form class="form" th:action="@{/admin/products/save}" th:object="${productView}" method="post">

                <!-- ID-Feld nur anzeigen, wenn Produkt bereits existiert -->
                <div class="form-group" th:if="${productView.pid} != null">
                    <label class="form-label" for="pid">Produkt-ID</label>
                    <input class="form-control" type="text" id="pid" th:field="*{pid}" readonly>
                    <p class="form-hint">Wird automatisch vergeben.</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="name">
                        Produktname <span class="required">*</span>
                    </label>
                    <input class="form-control" type="text" id="name" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required>
                    <p class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="brand">
                            Marke <span class="required">*</span>
                        </label>
                        <input class="form-control" type="text" id="brand" th:field="*{brand}"
                               th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid'" required>
                        <p class="form-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></p>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="price">
                            Preis <span class="required">*</span>
                        </label>
                        <input class="form-control" type="number" step="0.01" min="0" id="price" th:field="*{price}"
                               th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" required>
                        <p class="form-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
                    </div>
                </div>

                <div class="form-actions">
                    <!-- Button-Text dynamisch je nach Modus -->
                    <button class="btn btn-primary" type="submit"
                            th:text="${productView.pid} != null ? 'Änderungen speichern' : 'Neues Produkt speichern'">
                        Speichern
                    </button>
                    <a class="btn btn-secondary" th:href="@{/admin/products}">Abbrechen</a>
                </div>

            </form>
        </div>

    </main>

    <footer class="site-footer">
        <div class="container">
            <span>MiniShop</span>
            <span>Produktverwaltung</span>
        </div>
    </footer>

</body>

</html>
