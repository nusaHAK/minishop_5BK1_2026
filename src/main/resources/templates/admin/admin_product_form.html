<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${productView.pid} != null ? 'Produkt bearbeiten' : 'Produkt anlegen'">Produkt anlegen</title>
</head>

<body>
    <h1 th:text="${productView.pid} != null ? 'Produkt bearbeiten' : 'Neues Produkt anlegen'"></h1>

    <form th:action="@{/admin/products/save}" th:object="${productView}" method="post">
        <table border="0" cellpadding="10">
            <!-- ID-Feld nur anzeigen, wenn Produkt bereits existiert -->
            <tr th:if="${productView.pid} != null">
                <td>Produkt-ID</td>
                <td>
                    <input type="text" th:field="*{pid}" readonly>
                </td>
            </tr>

            <tr>
                <td>Produktname</td>
                <td>
                    <input type="text" th:field="*{name}" required>
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></div>
                </td>
            </tr>

            <tr>
                <td>Marke</td>
                <td>
                    <input type="text" th:field="*{brand}" required>
                    <div th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}" style="color:red"></div>
                </td>
            </tr>

            <tr>
                <td>Preis</td>
                <td>
                    <input type="number" step="0.01" th:field="*{price}" required>
                    <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:red"></div>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <!-- Button-Text dynamisch je nach Modus -->
                    <button type="submit" th:text="${productView.pid} != null ? 'Änderungen speichern' : 'Neues Produkt speichern'"></button>
                    &nbsp;
                    <a th:href="@{/admin/products}">Abbrechen</a>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
