<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren - MiniShop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="auth-page">
        <div class="card form-card auth-card">
            <div class="form-card-head">
                <div class="form-card-head-text">
                    <p class="eyebrow">MiniShop</p>
                    <h1>Konto erstellen</h1>
                    <p>Registriere dich, um im Shop einzukaufen.</p>
                </div>
            </div>

            <div class="form-body">
                <!-- Fehlermeldung (z. B. Benutzername oder E-Mail bereits vergeben) -->
                <div th:if="${errorMessage}" class="alert alert-danger mb-4">
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/register}" th:object="${user}" method="post" class="form">
                    <div class="form-group">
                        <label for="username" class="form-label">Benutzername <span class="required">*</span></label>
                        <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="z. B. max.muster" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">E-Mail <span class="required">*</span></label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="max@beispiel.at" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Passwort <span class="required">*</span></label>
                        <input type="password" id="password" th:field="*{password}" class="form-control" minlength="4" placeholder="Mindestens 4 Zeichen" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Registrieren</button>
                </form>

                <div class="auth-footer">
                    Bereits ein Konto vorhanden? <a th:href="@{/login}">Hier einloggen</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
